[package]
name = "cloakcli-desktop"
version = "0.3.0"
description = "CloakCLI desktop — Tauri 2 geek ops console (M3); PTY TUI is Diagnostics only"
authors = ["CloakCLI Contributors"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "cloakcli_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Do not enable the `devtools` feature: release WebView inspector must stay off.
# `tauri dev` still has DevTools via debug assertions.
tauri = { version = "2", features = [] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
