[package]
name = "cloakcli-desktop"
version = "0.1.0"
description = "CloakCLI desktop shell — Tauri 2 window + PTY around `cloakcli tui`"
authors = ["CloakCLI Contributors"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "cloakcli_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
